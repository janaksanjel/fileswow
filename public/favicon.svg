<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Same mark as the header logo (src/components/header.tsx):
       rounded tile, accent gradient, white paper sheet with folded
       corner, and ink text lines in accent-hover. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="16" y="16" width="480" height="480" rx="150"/>
    </clipPath>
  </defs>

  <!-- Tile: from-accent-light to-accent gradient -->
  <rect x="16" y="16" width="480" height="480" rx="150" fill="url(#tile)"/>

  <!-- Inset top highlight (inset_0_1px_0 rgba(255,255,255,0.35)) -->
  <g clip-path="url(#tileClip)">
    <rect x="16" y="16" width="480" height="16" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Hairline ring (ring-1 ring-black/5) -->
  <rect x="16" y="16" width="480" height="480" rx="150" fill="none" stroke="#101828" stroke-opacity="0.05" stroke-width="16"/>

  <!-- Paper sheet with folded corner + ink text lines -->
  <g transform="translate(120 120) scale(11.3333)">
    <path d="M5.5 2.5h7.2L19 8.3V21.5H5.5z" fill="#ffffff"/>
    <path d="M12.7 2.5v5.8H19z" fill="#15803d" opacity="0.55"/>
    <rect x="7.9" y="10.4" width="6.6" height="1.5" rx="0.75" fill="#15803d"/>
    <rect x="7.9" y="13" width="4.8" height="1.5" rx="0.75" fill="#15803d" opacity="0.55"/>
    <rect x="7.9" y="15.6" width="5.6" height="1.5" rx="0.75" fill="#15803d"/>
  </g>
</svg>
